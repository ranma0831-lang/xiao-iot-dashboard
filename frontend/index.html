<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XIAO IoT 대시보드</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --fg:#1d2330; --muted:#6b7280; --accent:#2563eb; --on:#16a34a; --err:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --card:#1b2028; --fg:#e5e7eb; --muted:#9ca3af; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  .card { background:var(--card); border-radius:12px; padding:20px; margin-bottom:16px; box-shadow:0 1px 3px #0002; }
  h1 { font-size:1.4rem; margin:0 0 16px; display:flex; justify-content:space-between; align-items:center; }
  h2 { font-size:1rem; margin:0 0 12px; color:var(--muted); }
  label { display:block; font-size:.85rem; margin:8px 0 4px; }
  input { width:100%; padding:10px; border:1px solid #8884; border-radius:8px; background:transparent; color:inherit; font-size:1rem; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:1rem; cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid #8884; }
  .row { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; }
  .stat b { display:block; font-size:2rem; }
  .stat span { color:var(--muted); font-size:.85rem; }
  .led { width:56px; height:56px; border-radius:50%; background:#8884; transition:.2s; }
  .led.on { background:var(--on); box-shadow:0 0 24px var(--on); }
  canvas { width:100%; height:180px; }
  #msg { color:var(--err); min-height:1.2em; margin-top:8px; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  td, th { text-align:left; padding:6px 4px; border-bottom:1px solid #8882; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <section id="auth" class="card">
    <h1>XIAO IoT 대시보드</h1>
    <form id="authForm">
      <label for="email">이메일</label>
      <input id="email" type="email" required autocomplete="username">
      <label for="password">비밀번호 (6자 이상)</label>
      <input id="password" type="password" required minlength="6" autocomplete="current-password">
      <div class="row">
        <button type="submit" data-action="login">로그인</button>
        <button type="submit" data-action="signup" class="ghost">회원가입</button>
      </div>
    </form>
    <p id="msg" role="alert"></p>
  </section>

  <section id="dash" hidden>
    <div class="card">
      <h1>XIAO ESP32S3 <button id="logout" class="ghost">로그아웃</button></h1>
      <div class="stats">
        <div class="stat"><b id="temp">-</b><span>칩 온도 (°C)</span></div>
        <div class="stat"><b id="rssi">-</b><span>WiFi 신호 (dBm)</span></div>
        <div class="stat"><b id="seen">-</b><span>마지막 수신</span></div>
      </div>
    </div>
    <div class="card">
      <h2>LED 제어</h2>
      <div class="row" style="align-items:center">
        <div id="ledDot" class="led" aria-hidden="true"></div>
        <button id="ledOn">켜기</button>
        <button id="ledOff" class="ghost">끄기</button>
        <span id="ledText"></span>
      </div>
    </div>
    <div class="card">
      <h2>온도 추이 (최근 50개)</h2>
      <canvas id="chart"></canvas>
    </div>
    <div class="card">
      <h2>최근 센서값</h2>
      <table><thead><tr><th>시간</th><th>온도</th><th>RSSI</th></tr></thead><tbody id="rows"></tbody></table>
    </div>
  </section>
</main>
<script>
const API = "__API_URL__"; // 배포 시 Render 주소로 치환
const $ = id => document.getElementById(id);
let token = localStorage.getItem("token");
let timer;

async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    ...opts,
    headers: { "Content-Type": "application/json", ...(token && { Authorization: "Bearer " + token }) },
  });
  if (r.status === 401 && token) { logout(); throw new Error("다시 로그인하세요"); }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof body.detail === "string" ? body.detail : "요청 실패 (" + r.status + ")");
  return body;
}

$("authForm").addEventListener("submit", async e => {
  e.preventDefault();
  const action = e.submitter.dataset.action;
  const cred = JSON.stringify({ email: $("email").value, password: $("password").value });
  $("msg").textContent = "처리 중... (Render 무료 서버는 첫 요청에 30초쯤 걸릴 수 있음)";
  try {
    if (action === "signup") await api("/auth/signup", { method: "POST", body: cred });
    token = (await api("/auth/login", { method: "POST", body: cred })).access_token;
    localStorage.setItem("token", token);
    $("msg").textContent = "";
    show();
  } catch (err) { $("msg").textContent = err.message; }
});

function logout() {
  token = null; localStorage.removeItem("token"); clearInterval(timer);
  $("dash").hidden = true; $("auth").hidden = false;
}
$("logout").onclick = logout;

async function setLed(on) {
  try { renderLed((await api("/led", { method: "PUT", body: JSON.stringify({ on }) })).on); }
  catch (err) { $("ledText").textContent = err.message; }
}
$("ledOn").onclick = () => setLed(true);
$("ledOff").onclick = () => setLed(false);

function renderLed(on) {
  $("ledDot").classList.toggle("on", on);
  $("ledText").textContent = on ? "켜짐 (보드 반영까지 최대 몇 초)" : "꺼짐";
}

async function refresh() {
  try {
    const [rows, led] = await Promise.all([api("/readings?limit=50"), api("/led")]);
    renderLed(led.on);
    const last = rows[0];
    $("temp").textContent = last ? last.temperature.toFixed(1) : "-";
    $("rssi").textContent = last ? last.rssi : "-";
    $("seen").textContent = last ? new Date(last.created_at).toLocaleTimeString() : "없음";
    $("rows").innerHTML = rows.slice(0, 10).map(r =>
      `<tr><td>${new Date(r.created_at).toLocaleTimeString()}</td><td>${r.temperature.toFixed(1)}</td><td>${r.rssi}</td></tr>`).join("");
    draw(rows.map(r => r.temperature).reverse());
  } catch (err) { $("seen").textContent = err.message; }
}

function draw(values) {
  const c = $("chart"), ctx = c.getContext("2d");
  c.width = c.clientWidth * devicePixelRatio; c.height = c.clientHeight * devicePixelRatio;
  ctx.clearRect(0, 0, c.width, c.height);
  if (values.length < 2) return;
  const min = Math.min(...values) - 1, max = Math.max(...values) + 1, pad = 20 * devicePixelRatio;
  const x = i => pad + i * (c.width - 2 * pad) / (values.length - 1);
  const y = v => c.height - pad - (v - min) * (c.height - 2 * pad) / (max - min);
  ctx.fillStyle = getComputedStyle(document.body).color;
  ctx.font = `${11 * devicePixelRatio}px system-ui`;
  ctx.fillText(max.toFixed(1), 0, pad); ctx.fillText(min.toFixed(1), 0, c.height - 4);
  ctx.strokeStyle = "#2563eb"; ctx.lineWidth = 2 * devicePixelRatio; ctx.beginPath();
  values.forEach((v, i) => i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v)));
  ctx.stroke();
}

function show() {
  $("auth").hidden = true; $("dash").hidden = false;
  refresh(); clearInterval(timer); timer = setInterval(refresh, 3000);
}
if (token) show();
</script>
</body>
</html>
